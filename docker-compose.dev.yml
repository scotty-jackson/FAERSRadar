version: '3.8'

services:
  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: faers_db_dev
    environment:
      POSTGRES_DB: faers_db
      POSTGRES_USER: faers_user
      POSTGRES_PASSWORD: faers_password
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faers_user -d faers_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (development mode with hot reload)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: faers_backend_dev
    environment:
      DATABASE_URL: postgresql://faers_user:faers_password@db:5432/faers_db
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_PER_MINUTE: 1000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # Frontend (development mode with hot reload)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: builder
    container_name: faers_frontend_dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    restart: unless-stopped

volumes:
  postgres_data_dev:
